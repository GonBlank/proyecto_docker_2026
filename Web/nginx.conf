server {
    # Puerto en el que escucha nginx dentro del contenedor.
    listen 80;

    # Carpeta con index.html y echarts.min.js.
    root /usr/share/nginx/html;

    # Los pedidos que empiezan con /api/ se reenvían al servicio "api".
    location /api/ {
        proxy_pass http://api:5000;
    }
}
