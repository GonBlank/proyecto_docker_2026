services:
  # Base de datos MariaDB.
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Guarda los datos en la carpeta DB/data del proyecto.
      - ./DB/data:/var/lib/mysql
      # Crea las tablas la primera vez que arranca.
      - ./DB/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Comprueba que MariaDB esté lista para recibir conexiones.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Worker: consulta los servidores por SNMP y guarda las mediciones.
  python:
    build:
      context: ./Python
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POLL_INTERVAL: ${POLL_INTERVAL}
      RETENTION_DAYS: ${RETENTION_DAYS}
    # Espera a que la base de datos esté lista.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # API: la usa la página para leer y guardar datos.
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    volumes:
      # Da acceso a Docker para mostrar el estado de los contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POLL_INTERVAL: ${POLL_INTERVAL}
      # Nombre del proyecto, para encontrar sus contenedores.
      DOCKER_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Web: nginx entrega la página y reenvía /api/ al servicio api.
  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
    ports:
      # IP de la PC : puerto de la PC : puerto del contenedor.
      - "${WEB_BIND_IP}:${WEB_PORT}:80"
    # Arranca después de api y se reinicia si api se vuelve a crear.
    depends_on:
      api:
        condition: service_started
        restart: true
    restart: unless-stopped
